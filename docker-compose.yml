# Lab 2 -- given in full this time; you solved this in Lab 0.
#
# Two things differ from Lab 0 and both matter for the measurements:
#   * `privileged: true` is required, not optional: A4/B1 create network namespaces
#     and qdiscs, and A3 needs the OVS *kernel* datapath, which only works when the
#     container can talk to the host kernel's openvswitch module.
#   * the container is named `lab2`; every `make` target and every test uses it.
services:
  lab2:
    build: .
    container_name: lab2
    hostname: lab2
    privileged: true
    # mnexec closes every descriptor up to RLIMIT_NOFILE when it creates a host.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - .:/workspace
    working_dir: /workspace
    tty: true
    stdin_open: true
